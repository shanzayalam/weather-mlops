name: CI/CD Pipeline

on:
  push:
    branches:
      - Dev  # Trigger pipeline on push to the Dev branch
      - Testing  # Trigger pipeline on push to the Testing branch
  pull_request:
    branches:
      - Prod  # Trigger pipeline on pull requests to the Prod branch

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run tests
    - name: Run tests
      run: |
        pytest --junitxml=test-results.xml

  deploy:
    name: Deploy to Kubernetes (Prod only)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Prod'

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Authenticate with Kubernetes cluster
    - name: Set up kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

    # Step 3: Deploy application to Kubernetes
    - name: Deploy application
      run: |
        kubectl apply -f k8s/deployment.yaml
